global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order:8080']
        labels: {service: order-service}
      - targets: ['inventory:8080']
        labels: {service: inventory-service}
      - targets: ['incidentlens:8080']
        labels: {service: incidentlens}
