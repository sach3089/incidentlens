name: Build and verify IncidentLens
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven tests and package
        run: mvn -B verify
      - name: Docker image build
        run: docker build -t incidentlens:local .
      - name: Start local-only Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --no-build -d
      - name: End-to-end evidence collection
        run: bash scripts/smoke.sh
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose logs --no-color > diagnostics/compose.log 2>&1 || true
          cp report.json diagnostics/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            diagnostics/
            target/surefire-reports/
          retention-days: 3
      - name: Stop demo stack
        if: always()
        run: docker compose down -v
